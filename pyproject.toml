[project]
name = "climate-cli"
version = "0.6.0"
description = "Agent and CLI for a multi-provider weather tracker: run the collection stack (MongoDB + tracker + read-only web service), keep every provider response verbatim, and query the collection — latest reading first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
keywords = [
    "weather",
    "climate",
    "agent",
    "cli",
    "observations",
    "forecast",
    "open-meteo",
    "met-no",
    "metar",
    "time-series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = []

# The weather-tracking service's storage backend. The host CLI is
# standard-library only and reaches the collection through the web service's
# HTTP API, so pymongo lives here rather than in `dependencies`: only the
# container image installs it (`pip install ".[weather]"`, see Dockerfile) and
# `climate.weather.mongo` lazy-imports it inside function bodies, so the empty
# default `dependencies` invariant holds and service code run without the
# extra exits code 2 with an install hint (never an ImportError traceback).
[project.optional-dependencies]
weather = ["pymongo>=4"]

[project.urls]
Homepage = "https://github.com/agentculture/climate-cli"
Issues = "https://github.com/agentculture/climate-cli/issues"

[project.scripts]
climate = "climate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["climate"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    # tests/weather/test_compose.py parses docker-compose.yml and asserts its
    # data-safety invariants; it imports yaml outright so the check can never
    # silently skip itself away.
    "pyyaml>=6.0",
]

[tool.coverage.run]
source = ["climate"]
omit = ["climate/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=climate (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["climate"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
